name: 天交所 · 抓数据并部署

# 为什么把"抓数据"和"部署"放在同一个工作流里:
#   用 GITHUB_TOKEN 推送产生的 commit **不会**触发其它 workflow 运行,
#   所以"预抓 -> commit"和"push 触发 Pages 部署"拆成两个文件会失效。
#   合并后, 每次抓取完直接重新上传静态站并部署, 数据始终是新的。

on:
  push:
    branches: [main]
  schedule:
    # 每 30 分钟跑一次（GitHub 的 cron 是 UTC；高峰期可能延迟几分钟）
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: 跳过抓取，只重新部署
        type: boolean
        default: false

permissions:
  contents: write      # 提交预抓数据
  pages: write         # 部署 Pages
  id-token: write      # deploy-pages 需要

concurrency:
  group: tjs-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取中国天气网官方数据
        if: ${{ github.event.inputs.skip_fetch != 'true' }}
        run: python tools/prefetch_official.py --workers 8
        continue-on-error: true      # 上游抽风不应阻断部署

      - name: 提交数据变化
        run: |
          git config user.name  "tjs-bot"
          git config user.email "tjs-bot@users.noreply.github.com"
          git add -A web/data/official
          if git diff --staged --quiet; then
            echo "官方数据无变化"
          else
            git commit -m "chore(data): 预抓中国天气网数据 $(date -u '+%Y-%m-%dT%H:%MZ')"
            git push
          fi

      - name: 把客户端安装包放进站点
        # dist/ 是本地构建好并提交进仓库的（仓库里没有 CI 能跑的 Android SDK / JDK 组合），
        # 这里只把它拷进 web/dist/ 让 Pages 能直接下载站点底部的 .exe / .apk。
        # 拷贝是临时的，web/dist/ 已在 .gitignore 里，不会被提交。
        # 用纯 ASCII 别名发布：中文文件名在 CDN / 不同浏览器上的百分号编码行为不一致，
        # 别名能保证下载链接在任何环境都点得通，下载下来的文件名也不会乱码。
        run: |
          mkdir -p web/dist
          cp -f dist/*.exe web/dist/tjs-weather-windows.exe 2>/dev/null || echo "还没有 .exe，跳过"
          cp -f dist/*.apk web/dist/tjs-weather-android.apk 2>/dev/null || echo "还没有 .apk，跳过"
          ls -lh web/dist || true

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包静态站
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 部署
        id: deploy
        uses: actions/deploy-pages@v4
