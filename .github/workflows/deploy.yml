name: 天气战士 · 抓数据并部署

# 为什么把"抓数据"和"部署"放在同一个工作流里:
#   用 GITHUB_TOKEN 推送产生的 commit **不会**触发其它 workflow 运行,
#   所以"预抓 -> commit"和"push 触发 Pages 部署"拆成两个文件会失效。
#   合并后, 每次抓取完直接重新上传静态站并部署, 数据始终是新的。

on:
  push:
    branches: [main]
  schedule:
    # 每 30 分钟跑一次（GitHub 的 cron 是 UTC；高峰期可能延迟几分钟）
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: 跳过抓取，只重新部署
        type: boolean
        default: false

permissions:
  contents: write      # 提交预抓数据
  pages: write         # 部署 Pages
  id-token: write      # deploy-pages 需要

concurrency:
  group: tjs-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取中国天气网官方数据
        if: ${{ github.event.inputs.skip_fetch != 'true' }}
        run: python tools/prefetch_official.py --workers 8
        continue-on-error: true      # 上游抽风不应阻断部署

      - name: 提交数据变化
        # 这一步骤**必须不能失败**：提交预抓数据只是附带动作，真正目的是重新部署。
        # 原来既没有 continue-on-error、push 前也不 rebase —— 推送触发的运行和 cron
        # 触发的运行会同时想提交 web/data/official，后到的那个被
        #   ! [rejected]  main -> main (fetch first)
        # 拒绝，步骤失败 → 后面「放进安装包 / 配置 Pages / 打包静态站 / 部署」全部 skipped，
        # 站点就停在旧版本。真实踩过：run #11（提交 edaa7a510b 上的定时运行）。
        continue-on-error: true
        run: |
          set -u
          git config user.name  "tjs-bot"
          git config user.email "tjs-bot@users.noreply.github.com"
          git add -A web/data/official
          if git diff --staged --quiet; then
            echo "官方数据无变化"
            exit 0
          fi
          git commit -m "chore(data): 预抓中国天气网数据 $(date -u '+%Y-%m-%dT%H:%MZ')"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "预抓数据已推送"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "第 $i 次推送失败（多半是另一个运行抢先推了），重试…"
            sleep $((i * 3))
          done
          echo "::warning::预抓数据连续 5 次推送失败，跳过提交，部署继续（数据下次再说）"

      - name: 把客户端安装包放进站点
        # dist/ 是本地构建好并提交进仓库的（仓库里没有 CI 能跑的 Android SDK / JDK 组合），
        # 这里只把它拷进 web/dist/ 让 Pages 能直接下载站点底部的 .apk。
        # 拷贝是临时的，web/dist/ 已在 .gitignore 里，不会被提交。
        # 用纯 ASCII 别名发布：中文文件名在 CDN / 不同浏览器上的百分号编码行为不一致，
        # 别名能保证下载链接在任何环境都点得通，下载下来的文件名也不会乱码。
        run: |
          mkdir -p web/dist
          # 这里必须「先挑出唯一一个 apk，再拷」。原来的写法是
          #   cp -f dist/*.apk web/dist/weather-fighter-android.apk 2>/dev/null || echo ...
          # dist/ 里一旦有两个 .apk（改名前的旧包没从仓库清掉时就会这样），glob 会展开成
          # 多个参数，cp 认为最后一个参数不是目录而直接报错，错误又被 2>/dev/null || echo
          # 吞掉 —— 步骤显示 success，站点上却根本没有下载文件（真实踩过这个坑）。
          # 取最新的一个（ls -1t），有多个时只警告不失败，避免阻塞部署。
          apk=$(ls -1t dist/*.apk 2>/dev/null | head -n 1)
          n=$(ls -1 dist/*.apk 2>/dev/null | wc -l)
          if [ "$n" -gt 1 ]; then
            echo "::warning::dist/ 下有 $n 个 .apk，只取最新的那个；建议把旧包从仓库删掉"
          fi
          if [ -z "$apk" ]; then
            echo "dist/ 下没有 .apk，跳过（站点底部的下载按钮会 404）"
          else
            echo "选中安装包: $apk"
            cp -f "$apk" web/dist/weather-fighter-android.apk
          fi
          ls -lh web/dist

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包静态站
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 部署
        id: deploy
        uses: actions/deploy-pages@v4
